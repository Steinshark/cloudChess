seed: 1337

data:
  dataset_root: "D:/data/chess/lichess_db"
  train_split_percent: 98
  validation_split_percent: 1
  split_seed: 7349
  read_chunk_size: 8192
  shuffle_buffer_chunks: 4
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true

model:
  input_planes: 34
  channels: 128
  residual_blocks: 12
  policy_planes: 73
  value_hidden: 256
  normalization: batchnorm
  activation: relu

training:
  output_dir: "D:/data/chess/bootstrap_runs/resnet12x128"
  batch_size: 64
  gradient_accumulation_steps: 1
  max_steps: 100000
  learning_rate: 0.0002
  minimum_learning_rate: 0.000002
  weight_decay: 0.0001
  beta1: 0.9
  beta2: 0.999
  warmup_steps: 2000
  gradient_clip_norm: 1.0
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  label_smoothing: 0.02
  precision: fp16
  channels_last: true
  compile_model: false
  log_every_steps: 50
  validate_every_steps: 2000
  checkpoint_every_steps: 2000
  validation_batches: 200
  resume_from: null
  keep_last_checkpoints: 5
