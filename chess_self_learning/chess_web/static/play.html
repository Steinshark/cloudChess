<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neural Chess LAN</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">♞</span><span>Neural Chess LAN</span></a>
  <nav class="nav"><a class="active" href="/">Play</a><a href="/stats">Training</a></nav>
</header>
<main class="page">
  <div id="error" class="error-banner"></div>
  <section class="play-layout">
    <div class="panel board-shell">
      <div class="board-wrap">
        <div id="board" class="chessboard" aria-label="Chess board"></div>
        <div id="thinking" class="board-overlay"><div><div class="spinner"></div><div style="margin-top:14px;font-weight:800">Model is searching…</div></div></div>
      </div>
    </div>
    <aside class="side-panel">
      <section class="panel controls">
        <div>
          <div class="label">New game</div>
          <h2 style="margin:5px 0 0">Choose your opponent</h2>
        </div>
        <div class="control"><label class="label" for="model">Checkpoint</label><select id="model"></select></div>
        <div class="control-row">
          <div class="control"><label class="label" for="side">Your side</label><select id="side"><option value="white">White</option><option value="black">Black</option></select></div>
          <div class="control"><label class="label" for="simulations">MCTS simulations</label><select id="simulations"><option value="32">32 · Quick</option><option value="128" selected>128 · Standard</option><option value="400">400 · Strong</option><option value="800">800 · Maximum</option></select></div>
        </div>
        <button id="new-game" class="primary">Start new game</button>
        <button id="refresh-models" class="secondary">Refresh checkpoint list</button>
      </section>
      <section class="panel status-card">
        <div class="status-line"><div><div class="label">Game status</div><div id="status" class="status-main">Select a model</div></div><span id="turn-badge" class="badge"><span class="dot"></span>Idle</span></div>
        <div id="model-meta" class="model-meta"></div>
        <div id="ai-details" class="ai-details" style="display:none"></div>
      </section>
      <section class="panel move-panel">
        <div class="label">Moves</div>
        <div id="move-list" class="move-list"><div class="empty" style="grid-column:1/-1">No game in progress.</div></div>
      </section>
    </aside>
  </section>
</main>
<div id="promotion-modal" class="promotion-modal">
  <div class="panel promotion-box"><div class="label">Promotion</div><h2 style="margin:6px 0">Choose a piece</h2><div id="promotion-options" class="promotion-options"></div></div>
</div>
<script src="/static/play.js"></script>
</body>
</html>
